baseURL = 'https://yak3d.com/'
languageCode = 'en-us'
title = 'yak | an alpine meadow'
theme = ['hugo-video', 'razorgrrl']
staticDir = ["static"]

# Declaring any mount targeting assets/ replaces Hugo's default assets->assets
# mount, so it has to be restated explicitly or style.scss and the fonts vanish.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  # Reach logo.png from resources.Get for the social card, without moving it
  # out of static/ (which would 404 https://yak3d.com/logo.png).
  [[module.mounts]]
    source = "static/logo.png"
    target = "assets/images/logo.png"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[languages]
  [languages.en]
    title = "yak"

  [languages.en.params]
    subtitle = "an alpine meadow"

  [languages.en.params.logo]
    logoText = "yak"

[pagination]
  disableAliases = false
  pagerSize = 20
  path = 'page'

[params]
  showMenuItems = 3
  author = "yak"
  headline = "An alpine meadow where yaks graze"
  description = "Blog"
  ogLocale = "en_US"

[params.navigation]
  [[params.navigation.list]]
    name = "home"
    link = "/"
  [[params.navigation.list]]
    name = "stories"
    link = "/stories"
  [[params.navigation.list]]
    name = "about"
    link = "/about"

[params.contact]
  [[params.contact.list]]
    name = "GitHub"
    icon = "fab fa-github"
    link = "https://github.com/yak3d"
  [[params.contact.list]]
    name = "Bluesky"
    icon = "fa-brands fa-bluesky"
    link = "https://bsky.app/profile/yak3d.com"

