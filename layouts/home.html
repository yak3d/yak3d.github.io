{{ define "main" }}

<div class="post-content">{{ .Content }}</div>

{{ partial "section-list.html" (dict "Site" .Site "contentType" "posts") }}

{{ $list := (where .Site.Pages "Type" "posts") }}
{{ $len := (len $list) }}

{{ if gt $len 5 }}
<div class="footer-div home-color">
    <ul class="left-list">
        <li><a href="{{ "/archives/" | relURL }}" class="back-button">view all posts</a></li>
    </ul>
    <ul class="right-list">
        <li><a href="#" class="back-button" id="load-more">load more</a></li>
    </ul>
</div>
{{ end }}

{{ end }}
